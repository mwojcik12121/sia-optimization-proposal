name: sia-modern-test

x-node-base: &node-base
  restart: "no"
  pull_policy: never
  volumes:
    - /etc/localtime:/etc/localtime:ro
  cap_add:
    - NET_ADMIN
  security_opt:
    - no-new-privileges:true
  networks:
    - sia_internal
  mem_limit: 3g
  memswap_limit: 3g
  cpus: 1.0
  storage_opt:
    size: "93750000000"
  pids_limit: 2048
  stop_grace_period: 45s
  expose:
    - "9980"
    - "9981"
    - "9984"
    - "10980"
    - "10981"
  healthcheck:
    test: ["CMD-SHELL", "test -f /run/sia-lab/initial-chain-ready"]
    interval: 5s
    timeout: 3s
    start_period: 20s
    retries: 1440
  logging:
    driver: json-file
    options:
      max-size: "25m"
      max-file: "2"

x-common-environment: &common-environment
  SIA_API_PASSWORD: "${SIA_API_PASSWORD:-lab-api-password}"
  SIA_NETWORK: "zen"
  SCENARIO: "${SCENARIO:-1}"
  LAB_NODES: "${LAB_NODES:-node01 node02 node03 node04 node05 node06 node07 node08}"
  INITIAL_CHAIN_HEIGHT: "200"
  BOOTSTRAP_TIMEOUT_SECONDS: "${BOOTSTRAP_TIMEOUT_SECONDS:-7200}"
  SCENARIO_TIMEOUT_SECONDS: "${SCENARIO_TIMEOUT_SECONDS:-2400}"
  SCENARIO_RELEASE_TIMEOUT_SECONDS: "${SCENARIO_RELEASE_TIMEOUT_SECONDS:-900}"
  SCENARIO_SETUP_BLOCKS: "${SCENARIO_SETUP_BLOCKS:-40}"
  SCENARIO_BLOCKS: "${SCENARIO_BLOCKS:-240}"
  SCENARIO_DRAIN_BLOCKS: "${SCENARIO_DRAIN_BLOCKS:-80}"
  SCENARIO_MINE_INTERVAL_SECONDS: "${SCENARIO_MINE_INTERVAL_SECONDS:-4}"
  SCENARIO_TRANSFER_TIMEOUT_SECONDS: "${SCENARIO_TRANSFER_TIMEOUT_SECONDS:-45}"
  TZ: "${TZ:-:/etc/localtime}"

services:
  node01:
    <<: *node-base
    hostname: node01
    image: "sia-test-node01:${BUILD_TAG:-missing}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: renter-modified-runtime
      network: none
      args:
        RUNTIME_TOOLS_IMAGE: "${RUNTIME_TOOLS_IMAGE:-sia-lab-runtime-tools:bookworm}"
        BUILD_TAG: "${BUILD_TAG:-missing}"
    environment:
      <<: *common-environment
      NODE_ID: "01"
      NODE_NAME: "node01"
      SIA_DAEMON: "renterd"

  node02:
    <<: *node-base
    hostname: node02
    image: "sia-test-node02:${BUILD_TAG:-missing}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: renter-unmodified-runtime
      network: none
      args:
        RUNTIME_TOOLS_IMAGE: "${RUNTIME_TOOLS_IMAGE:-sia-lab-runtime-tools:bookworm}"
        BUILD_TAG: "${BUILD_TAG:-missing}"
    environment:
      <<: *common-environment
      NODE_ID: "02"
      NODE_NAME: "node02"
      SIA_DAEMON: "renterd"

  node03:
